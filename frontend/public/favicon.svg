<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Degradado Eléctrico Azul-Violeta para la Burbuja -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Degradado Radiante para la Chispa IA (Dorado a Cian) -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Burbuja de Diálogo Maximizada (Fondo Transparente) -->
  <path 
    d="M 14 2 
       H 50 
       C 56.6 2 62 7.4 62 14 
       V 36 
       C 62 42.6 56.6 48 50 48 
       H 26 
       L 7 61 
       L 14 48 
       C 7.4 48 2 42.6 2 36 
       V 14 
       C 2 7.4 7.4 2 14 2 
       Z" 
    fill="url(#bubbleGrad)" 
  />

  <!-- Chispa de IA Principal (Agrandada y Protagónica) -->
  <path 
    d="M 45 7 
       Q 45 25 60 25 
       Q 45 25 45 43 
       Q 45 25 29 25 
       Q 45 25 45 7 
       Z" 
    fill="url(#starGrad)" 
  />

  <!-- Letra 'T' en Blanco Puro (Agrandada, Gruesa y en Primer Plano) -->
  <!-- Barra Horizontal -->
  <rect x="9" y="11" width="22" height="7" rx="2" fill="#ffffff" />
  <!-- Barra Vertical -->
  <rect x="16.5" y="18" width="7" height="24" rx="2" fill="#ffffff" />
</svg>